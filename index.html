<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snab AI Pro — Сметы без ошибок</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --blue: #2563eb; --dark: #0f172a; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f1f5f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: var(--blue); margin-bottom: 25px; }
        
        textarea, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; }
        .calc-btn { width: 100%; padding: 15px; background: var(--blue); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* Стиль для вывода на экран */
        .item-row { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 12px; margin-top: 15px; }
        .item-name { font-weight: 800; font-size: 18px; margin-bottom: 10px; display: block; }
        .offer-line { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid #eee; }
        .btn-check { background: var(--dark); color: white; text-decoration: none; padding: 5px 10px; border-radius: 6px; font-size: 12px; }

        /* Скрытый блок для PDF */
        #pdf-template { display: none; }
        .pdf-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .pdf-table th, .pdf-table td { border: 1px solid #000; padding: 8px; text-align: left; font-size: 12px; }
        .pdf-header { text-align: center; margin-bottom: 20px; }
        .total-row { font-weight: bold; background: #eee; }

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-wa { background: #22c55e; color: white; padding: 15px; border-radius: 10px; text-align: center; text-decoration: none; font-weight: bold; }
        .btn-pdf { background: #64748b; color: white; padding: 15px; border-radius: 10px; cursor: pointer; border: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Qazaq Snab AI Pro</h2>
    <select id="city"><option>Караганда</option><option>Астана</option><option>Алматы</option></select>
    <textarea id="txt" rows="3" placeholder="Что закупаем? (напр. 200 кирпичей, 5 красок)"></textarea>
    <button class="calc-btn" id="main-btn" onclick="calculate()">СФОРМИРОВАТЬ СМЕТУ</button>

    <div id="result-box" style="display:none">
        <div id="display-output"></div>
        
        <div class="actions">
            <a href="#" class="btn-wa" onclick="sendWA()">WhatsApp</a>
            <button class="btn-pdf" onclick="generatePDF()">СКАЧАТЬ PDF</button>
        </div>
    </div>
</div>

<div id="pdf-template">
    <div class="pdf-header">
        <h1 style="margin:0">СМЕТА МАТЕРИАЛОВ</h1>
        <p id="pdf-meta"></p>
    </div>
    <table class="pdf-table">
        <thead>
            <tr>
                <th>Наименование</th>
                <th>Кол-во</th>
                <th>Ед.</th>
                <th>Цена (ед)</th>
                <th>Сумма</th>
                <th>Магазин/Источник</th>
            </tr>
        </thead>
        <tbody id="pdf-body"></tbody>
        <tfoot>
            <tr class="total-row">
                <td colspan="4" style="text-align:right">ИТОГО К ОПЛАТЕ:</td>
                <td id="pdf-total"></td>
                <td>ТЕНГЕ</td>
            </tr>
        </tfoot>
    </table>
    <p style="font-size: 10px; margin-top: 20px;">* Цены являются ориентировочными и сформированы на основе анализа рынка. Для уточнения перейдите по ссылкам в приложении.</p>
</div>

<script>
let lastData = [];

async function calculate() {
    const btn = document.getElementById("main-btn");
    btn.innerText = "ПОИСК В БАЗАХ..."; btn.disabled = true;

    try {
        const res = await fetch("/api/calculate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ materials: document.getElementById("txt").value, city: document.getElementById("city").value })
        });
        const json = await res.json();
        lastData = JSON.parse(json.choices[0].message.content.match(/\[.*\]/s)[0]);

        renderUI();
    } catch (e) {
        alert("Ошибка! Попробуйте написать список проще.");
    } finally {
        btn.innerText = "СФОРМИРОВАТЬ СМЕТУ"; btn.disabled = false;
    }
}

function renderUI() {
    let html = "";
    lastData.forEach(item => {
        html += `<div class="item-row">
            <span class="item-name">${item.n} (${item.q} ${item.u})</span>`;
        item.offers.forEach(o => {
            html += `<div class="offer-line">
                <span><b>${o.m}:</b> ${o.p.toLocaleString()} ₸</span>
                <a href="${o.l}" target="_blank" class="btn-check">ПРОВЕРИТЬ</a>
            </div>`;
        });
        html += `</div>`;
    });
    document.getElementById("display-output").innerHTML = html;
    document.getElementById("result-box").style.display = "block";
}

function generatePDF() {
    const city = document.getElementById("city").value;
    const date = new Date().toLocaleDateString();
    document.getElementById("pdf-meta").innerText = `Город: ${city} | Дата: ${date}`;

    let rows = "", grandTotal = 0;
    lastData.forEach(item => {
        const best = item.offers[0];
        const sum = best.p * item.q;
        grandTotal += sum;
        rows += `<tr>
            <td>${item.n}</td>
            <td>${item.q}</td>
            <td>${item.u}</td>
            <td>${best.p.toLocaleString()}</td>
            <td>${sum.toLocaleString()}</td>
            <td>${best.m}</td>
        </tr>`;
    });

    document.getElementById("pdf-body").innerHTML = rows;
    document.getElementById("pdf-total").innerText = grandTotal.toLocaleString();

    const element = document.getElementById("pdf-template");
    element.style.display = "block";
    const opt = {
        margin: 10,
        filename: `Smeta_${city}_${date}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(element).save().then(() => {
        element.style.display = "none";
    });
}

function sendWA() {
    let text = `*СМЕТА МАТЕРИАЛОВ (${document.getElementById("city").value})*\n\n`;
    let total = 0;
    lastData.forEach(i => {
        const s = i.offers[0].p * i.q;
        total += s;
        text += `• ${i.n}: *${s.toLocaleString()} ₸* (${i.offers[0].m})\n`;
    });
    text += `\n*ИТОГО: ${total.toLocaleString()} ₸*`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
}
</script>
</body>
</html>
