<div class="card">
    <h2>🇰🇿 Qazaq Snab AI Pro</h2>
    
    <label class="label">ГОРОД:</label>
    <select id="city">
        <option value="Караганда">Караганда</option>
        <option value="Астана">Астана</option>
        <option value="Алматы">Алматы</option>
        <option value="Шымкент">Шымкент</option>
    </select>

    <label class="label">СПИСОК МАТЕРИАЛОВ:</label>
    <textarea id="txt" placeholder="Напр: 5 мешков цемента, 20 метров арматуры..."></textarea>
    
    <button id="btn" class="btn-calc" onclick="calc()">РАССЧИТАТЬ СМЕТУ</button>

    <div id="result">
        <div id="pdf-content" style="padding: 10px;">
            <h3 style="color: #611fdb; border-bottom: 2px solid #611fdb; padding-bottom: 10px;">
                Смета: <span id="res-city"></span> (Май 2026)
            </h3>
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: #f1f5f9;">
                        <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Наименование</th>
                        <th style="padding: 10px; border: 1px solid #ddd; text-align: center;">Кол-во</th>
                        <th style="padding: 10px; border: 1px solid #ddd; text-align: right;">Сумма</th>
                        <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Магазин</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
            <div id="total-area" style="background: #e8f0fe; padding: 15px; border-radius: 8px; text-align: right; font-size: 18px; font-weight: bold; margin-top: 10px;">
                ИТОГО: <span id="total-sum">0 ₸</span>
            </div>
        </div>
        
        <button class="btn-wa" onclick="sendWA()">В WHATSAPP</button>
        <button class="btn-pdf" onclick="downloadPDF()">СОХРАНИТЬ PDF</button>
    </div>
</div>

<script>
async function calc() {
    const txt = document.getElementById("txt").value;
    const city = document.getElementById("city").value;
    const btn = document.getElementById("btn");
    
    if(!txt) return alert("Введите список");

    btn.disabled = true;
    btn.innerText = "ГРУППИРУЕМ И СЧИТАЕМ...";

    try {
        const res = await fetch("/api/calculate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ materials: txt, city: city })
        });
        
        const data = await res.json();
        const content = data.choices[0].message.content;
        const items = JSON.parse(content.match(/\[.*\]/s)[0]);

        let sum = 0;
        let html = "";
        items.forEach(i => {
            sum += Number(i.p);
            html += `<tr>
                <td style="padding: 10px; border: 1px solid #eee;"><b>${i.n}</b></td>
                <td style="padding: 10px; border: 1px solid #eee; text-align: center;">${i.q} ${i.u}</td>
                <td style="padding: 10px; border: 1px solid #eee; text-align: right;">${Number(i.p).toLocaleString()} ₸</td>
                <td style="padding: 10px; border: 1px solid #eee; font-size: 12px;">
                    <a href="${i.l}" target="_blank" style="color: #611fdb; text-decoration: none;">${i.m} 🔗</a>
                </td>
            </tr>`;
        });

        document.getElementById("res-city").innerText = city;
        document.getElementById("table-body").innerHTML = html;
        document.getElementById("total-sum").innerText = sum.toLocaleString() + " ₸";
        document.getElementById("result").style.display = "block";
    } catch (e) {
        alert("Ошибка! Проверьте формат ввода.");
        console.error(e);
    } finally {
        btn.disabled = false;
        btn.innerText = "РАССЧИТАТЬ СМЕТУ";
    }
}

// Функции downloadPDF и sendWA остаются такими же (они уже работают хорошо)
function downloadPDF() {
    const element = document.getElementById('pdf-content');
    html2pdf().from(element).set({
        margin: 5,
        filename: 'Smeta_QazaqSnab.pdf',
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).save();
}

function sendWA() {
    let t = `*Смета Qazaq Snab (${document.getElementById("city").value})*\n\n`;
    document.querySelectorAll("#table-body tr").forEach(r => {
        const td = r.querySelectorAll("td");
        t += `• ${td[0].innerText}: ${td[1].innerText} — ${td[2].innerText}\n`;
    });
    t += `\n*ИТОГО: ${document.getElementById("total-sum").innerText}*`;
    window.open(`https://wa.me/?text=${encodeURIComponent(t)}`);
}
</script>
