<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qazaq Snab AI — Проф. Смета</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primary: #611fdb; --bg: #f4f7fb; --card: #ffffff; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .app { width: 100%; max-width: 600px; }
        
        .main-card { background: var(--card); padding: 30px; border-radius: 32px; box-shadow: 0 15px 45px rgba(0,0,0,0.04); }
        h1 { font-size: 24px; font-weight: 900; text-align: center; margin-bottom: 25px; }
        h1 span { color: var(--primary); }

        textarea, select { width: 100%; padding: 18px; border: 2px solid #edf2f7; border-radius: 20px; font-size: 16px; outline: none; box-sizing: border-box; margin-bottom: 15px; background: #f8fafc; transition: 0.3s; }
        textarea:focus { border-color: var(--primary); background: #fff; }

        .btn-go { width: 100%; padding: 20px; background: var(--primary); color: white; border: none; border-radius: 20px; font-size: 17px; font-weight: 800; cursor: pointer; }
        
        /* Таблица/Карточки */
        #result { display: none; margin-top: 30px; }
        .mat-item { background: white; border: 1px solid #e2e8f0; border-radius: 24px; padding: 20px; margin-bottom: 15px; }
        .mat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        .mat-name { font-weight: 800; font-size: 16px; color: #1a202c; }
        .mat-qty { background: #edf2f7; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; }

        .offer-line { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; margin-bottom: 5px; background: #f8fafc; }
        .offer-line.best { background: #f0fff4; border: 1px solid #c6f6d5; }
        
        .store-name { font-size: 13px; font-weight: 600; }
        .unit-price { font-size: 11px; color: #718096; display: block; }
        .total-price { font-weight: 800; font-size: 14px; text-align: right; }
        .buy-link { font-size: 10px; background: var(--primary); color: white; text-decoration: none; padding: 6px 10px; border-radius: 8px; font-weight: 700; }

        .final-sum { background: #1a202c; color: white; padding: 25px; border-radius: 24px; margin-top: 25px; text-align: right; }
        .final-sum small { opacity: 0.6; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .final-sum div { font-size: 28px; font-weight: 900; margin-top: 5px; }

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-sub { padding: 15px; border-radius: 15px; border: none; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<div class="app">
    <div class="main-card">
        <h1><span>Qazaq Snab</span> AI</h1>
        
        <select id="city">
            <option value="Караганда">Караганда</option>
            <option value="Астана">Астана</option>
            <option value="Алматы">Алматы</option>
        </select>

        <textarea id="txt" rows="3" placeholder="300 кирпичей, 5 мешков цемента..."></textarea>
        <button class="btn-go" id="btn" onclick="calculate()">РАССЧИТАТЬ СМЕТУ</button>

        <div id="result">
            <div id="render"></div>
            <div class="final-sum">
                <small>Общая сумма закупа (MIN):</small>
                <div id="grand-total">0 ₸</div>
            </div>
            <div class="actions">
                <button class="btn-sub" style="background:#25d366; color:white;" onclick="toWA()">WhatsApp</button>
                <button class="btn-sub" style="background:#edf2f7; color:#1a202c;" onclick="toPDF()">PDF Бланк</button>
            </div>
        </div>
    </div>
</div>

<script>
let itemsData = [];

async function calculate() {
    const txt = document.getElementById("txt").value;
    const city = document.getElementById("city").value;
    const btn = document.getElementById("btn");
    if(!txt) return;

    btn.disabled = true;
    btn.innerText = "ПОИСК И ПРОВЕРКА ЦЕН...";

    try {
        const res = await fetch("/api/calculate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ materials: txt, city: city })
        });
        const data = await res.json();
        itemsData = JSON.parse(data.choices[0].message.content.match(/\[.*\]/s)[0]);

        let html = "";
        let totalAll = 0;

        itemsData.forEach(item => {
            // Математика: умножаем цену на количество
            item.offers.forEach(o => o.total = o.p * item.q);
            item.offers.sort((a, b) => a.total - b.total);
            
            totalAll += item.offers[0].total;

            html += `
            <div class="mat-item">
                <div class="mat-header">
                    <span class="mat-name">${item.n}</span>
                    <span class="mat-qty">${item.q} ${item.u}</span>
                </div>`;
            
            item.offers.forEach((o, i) => {
                const best = i === 0;
                html += `
                <div class="offer-line ${best ? 'best' : ''}">
                    <div>
                        <span class="store-name">${best ? '⭐ ' : ''}${o.m}</span>
                        <span class="unit-price">${o.p.toLocaleString()} ₸ / ${item.u}</span>
                    </div>
                    <div class="total-price">${o.total.toLocaleString()} ₸</div>
                    <a href="${o.l}" target="_blank" class="buy-link">КУПИТЬ</a>
                </div>`;
            });
            html += `</div>`;
        });

        document.getElementById("render").innerHTML = html;
        document.getElementById("grand-total").innerText = totalAll.toLocaleString() + " ₸";
        document.getElementById("result").style.display = "block";
    } catch (e) { alert("Ошибка данных. Попробуйте еще раз."); }
    finally { btn.disabled = false; btn.innerText = "РАССЧИТАТЬ СМЕТУ"; }
}

function toPDF() {
    const element = document.getElementById("render");
    const opt = { margin: 10, filename: 'Smeta_Pro.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' } };
    html2pdf().set(opt).from(element).save();
}

function toWA() {
    let msg = `*ОТЧЕТ ПО СМЕТЕ (${document.getElementById("city").value})*\n\n`;
    itemsData.forEach(i => {
        msg += `*${i.n}* (${i.q} ${i.u})\n✅ Цена: ${i.offers[0].total.toLocaleString()} ₸ (${i.offers[0].m})\n🔗 ${i.offers[0].l}\n\n`;
    });
    msg += `*ИТОГО: ${document.getElementById("grand-total").innerText}*`;
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
}
</script>
</body>
</html>
