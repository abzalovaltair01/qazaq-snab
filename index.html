<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snab AI — Прораб на связи</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Manrope', sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 32px; margin: 0; color: #38bdf8; }
        .header p { color: #94a3b8; margin-top: 5px; }

        .form-box { background: #1e293b; padding: 20px; border-radius: 20px; border: 1px solid #334155; margin-bottom: 20px; }
        select, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; color: white; padding: 15px; border-radius: 12px; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; }
        .btn-calc { width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 18px; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-calc:hover { background: #7dd3fc; }

        .mat-card { background: #1e293b; border-radius: 15px; padding: 15px; margin-bottom: 15px; border-left: 5px solid #38bdf8; }
        .mat-name { font-size: 18px; font-weight: 800; display: flex; justify-content: space-between; margin-bottom: 10px; }
        
        .offer { display: grid; grid-template-columns: 1fr 100px 90px; gap: 10px; align-items: center; background: #334155; padding: 10px; border-radius: 10px; margin-top: 5px; }
        .offer b { font-size: 13px; color: #38bdf8; }
        .price { font-weight: 800; text-align: right; }
        .link { background: #0ea5e9; color: white; text-decoration: none; padding: 8px; border-radius: 6px; font-size: 11px; text-align: center; font-weight: 700; }

        .summary { background: #38bdf8; color: #0f172a; padding: 20px; border-radius: 15px; text-align: center; margin-top: 20px; }
        .summary h2 { margin: 0; font-size: 28px; }

        .footer-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .f-btn { padding: 15px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>СМЕТА ОТ ПРОРАБА</h1>
        <p>100% реальный поиск по Казахстану</p>
    </div>

    <div class="form-box">
        <select id="city"><option>Караганда</option><option>Астана</option><option>Алматы</option></select>
        <textarea id="txt" rows="4" placeholder="Список материалов (напр. 300 кирпичей, 5 мешков цемента...)"></textarea>
        <button class="btn-calc" id="btn" onclick="run()">ПОСЧИТАТЬ ЧЕСТНО</button>
    </div>

    <div id="results" style="display:none">
        <div id="list"></div>
        <div class="summary">
            <span>ИТОГО (ОРИЕНТИР):</span>
            <h2 id="total">0 ₸</h2>
        </div>
        <div class="footer-btns">
            <button class="f-btn" style="background:#22c55e; color:white" onclick="wa()">WhatsApp</button>
            <button class="f-btn" style="background:#64748b; color:white" onclick="pdf()">В PDF</button>
        </div>
    </div>
</div>

<script>
let state = [];

async function run() {
    const btn = document.getElementById("btn");
    btn.innerText = "ПРОРАБ ДУМАЕТ..."; btn.disabled = true;
    
    try {
        const res = await fetch("/api/calculate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ materials: document.getElementById("txt").value, city: document.getElementById("city").value })
        });
        const data = await res.json();
        state = JSON.parse(data.choices[0].message.content.match(/\[.*\]/s)[0]);

        let html = "", grand = 0;
        state.forEach(item => {
            let itemBestPrice = item.offers[0].p * item.q;
            grand += itemBestPrice;

            html += `<div class="mat-card">
                <div class="mat-name"><span>${item.n}</span> <span>${item.q} ${item.u}</span></div>`;
            
            item.offers.forEach(o => {
                html += `
                <div class="offer">
                    <b>${o.m}</b>
                    <div class="price">${(o.p * item.q).toLocaleString()} ₸</div>
                    <a href="${o.l}" target="_blank" class="link">ПРОВЕРИТЬ</a>
                </div>`;
            });
            html += `</div>`;
        });

        document.getElementById("list").innerHTML = html;
        document.getElementById("total").innerText = grand.toLocaleString() + " ₸";
        document.getElementById("results").style.display = "block";
    } catch (e) { alert("Ошибка! Попробуй еще раз."); }
    finally { btn.innerText = "ПОСЧИТАТЬ ЧЕСТНО"; btn.disabled = false; }
}

function wa() {
    let msg = `*СМЕТА (${document.getElementById("city").value})*\n\n`;
    state.forEach(i => msg += `• ${i.n} (${i.q}${i.u}) — *${(i.offers[0].p * i.q).toLocaleString()} ₸*\n`);
    msg += `\n*ИТОГО: ${document.getElementById("total").innerText}*`;
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
}

function pdf() { html2pdf().from(document.getElementById("list")).save('Smeta.pdf'); }
</script>
</body>
</html>
