<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qazaq Snab AI</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; width: 100%; max-width: 400px; padding: 25px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        h2 { color: #611fdb; text-align: center; }
        textarea { width: 100%; height: 100px; padding: 12px; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; margin-bottom: 15px; }
        button { width: 100%; padding: 15px; background: #611fdb; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        #result { display: none; margin-top: 20px; }
        .total { font-weight: bold; font-size: 1.2em; color: #611fdb; margin-top: 10px; text-align: right; }
    </style>
</head>
<body>

<div class="card">
    <h2>🇰🇿 Qazaq Snab AI</h2>
    <textarea id="txt" placeholder="Напишите: 5 мешков цемента..."></textarea>
    <button id="btn" onclick="calc()">РАССЧИТАТЬ</button>

    <div id="result">
        <table id="table" style="width:100%;"></table>
        <div id="total" class="total"></div>
        <button style="background:#25D366; margin-top:10px;" onclick="sendWA()">WhatsApp</button>
    </div>
</div>

<script>
async function calc() {
    const txt = document.getElementById("txt").value;
    const btn = document.getElementById("btn");
    if(!txt) return;

    btn.disabled = true;
    btn.innerText = "СЧИТАЕМ...";

    try {
        // Запрос к НАШЕМУ будущему серверу
        const res = await fetch("/api/calculate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ materials: txt })
        });
        
        const data = await res.json();
        const content = JSON.parse(data.choices[0].message.content.match(/\[.*\]/s)[0]);

        let sum = 0;
        let html = "";
        content.forEach(i => {
            sum += i.p;
            html += `<tr><td style="padding:8px 0; border-bottom:1px solid #eee;">${i.n}</td><td style="text-align:right;">${i.p.toLocaleString()} ₸</td></tr>`;
        });

        document.getElementById("table").innerHTML = html;
        document.getElementById("total").innerText = "ИТОГО: " + sum.toLocaleString() + " ₸";
        document.getElementById("result").style.display = "block";
    } catch (e) {
        alert("Ошибка. Попробуем еще раз?");
        console.error(e);
    } finally {
        btn.disabled = false;
        btn.innerText = "РАССЧИТАТЬ";
    }
}
</script>
</body>
</html>
