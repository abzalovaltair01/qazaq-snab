<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qazaq Snab AI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primary: #611fdb; --bg: #f3f4f6; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app { width: 100%; max-width: 500px; background: white; padding: 25px; border-radius: 28px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        
        h1 { font-size: 24px; text-align: center; margin-bottom: 25px; font-weight: 800; }
        h1 span { color: var(--primary); }

        select, textarea { 
            width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 18px; 
            font-size: 16px; margin-bottom: 15px; outline: none; box-sizing: border-box; background: #fafafa;
        }
        
        .btn { 
            width: 100%; padding: 18px; border: none; border-radius: 18px; 
            font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 10px; transition: 0.2s;
        }
        .btn-main { background: var(--primary); color: white; }
        .btn-wa { background: #25d366; color: white; }
        .btn-pdf { background: #111; color: white; }

        /* Адаптивный дизайн таблицы */
        #result { display: none; margin-top: 25px; }
        .item-row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 0; border-bottom: 1px solid #eee; 
        }
        .item-info b { display: block; font-size: 15px; margin-bottom: 4px; }
        .item-info span { font-size: 12px; color: #888; }
        .item-price { text-align: right; }
        .price-val { display: block; font-weight: 800; color: #000; margin-bottom: 5px; }
        .buy-btn { 
            font-size: 10px; padding: 5px 10px; border: 1px solid var(--primary); 
            color: var(--primary); text-decoration: none; border-radius: 8px; font-weight: 700;
        }

        .total-box { 
            background: #f4f0ff; padding: 20px; border-radius: 20px; 
            margin: 20px 0; display: flex; justify-content: space-between; align-items: center;
        }
        
        /* PDF только для генератора */
        #pdf-hide { display: none; }
    </style>
</head>
<body>

<div class="app">
    <h1><span>Qazaq</span> Snab</h1>
    
    <select id="city">
        <option value="Караганда">Караганда</option>
        <option value="Астана">Астана</option>
        <option value="Алматы">Алматы</option>
        <option value="Шымкент">Шымкент</option>
    </select>

    <textarea id="txt" rows="3" placeholder="Что нужно купить? (напр. 5 мешков цемента)"></textarea>
    
    <button id="btn" class="btn btn-main" onclick="calc()">РАССЧИТАТЬ</button>

    <div id="result">
        <div id="items-list"></div>
        <div class="total-box">
            <b>ИТОГО:</b>
            <span id="total-val" style="font-size: 20px; font-weight: 900; color: var(--primary);">0 ₸</span>
        </div>
        
        <button class="btn btn-wa" onclick="sendWA()">WHATSAPP</button>
        <button class="btn btn-pdf" onclick="downloadPDF()">PDF ДОКУМЕНТ</button>
    </div>
</div>

<div id="pdf-hide">
    <div id="pdf-tpl" style="padding: 40px; font-family: sans-serif; background: #fff;">
        <h2 style="color: #611fdb;">Смета: <span id="p-city"></span></h2>
        <hr>
        <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
            <tbody id="p-body"></tbody>
        </table>
        <h3 style="text-align: right; margin-top: 30px;">ИТОГО: <span id="p-total"></span></h3>
    </div>
</div>

<script>
let lastItems = [];

async function calc() {
    const txt = document.getElementById("txt").value;
    const city = document.getElementById("city").value;
    const btn = document.getElementById("btn");
    if(!txt) return;

    btn.disabled = true;
    btn.innerText = "ЗАПРОС ЦЕН...";

    try {
        const res = await fetch("/api/calculate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ materials: txt, city: city })
        });
        const data = await res.json();
        lastItems = JSON.parse(data.choices[0].message.content.match(/\[.*\]/s)[0]);

        let sum = 0;
        let html = "";
        lastItems.forEach(i => {
            sum += Number(i.p);
            html += `<div class="item-row">
                <div class="item-info">
                    <b>${i.n}</b>
                    <span>${i.q} ${i.u} • ${i.m}</span>
                </div>
                <div class="item-price">
                    <span class="price-val">${Number(i.p).toLocaleString()} ₸</span>
                    <a href="${i.l}" target="_blank" class="buy-btn">НАЙТИ</a>
                </div>
            </div>`;
        });

        document.getElementById("items-list").innerHTML = html;
        document.getElementById("total-val").innerText = sum.toLocaleString() + " ₸";
        document.getElementById("result").style.display = "block";
    } catch (e) { alert("Ошибка!"); }
    finally { btn.disabled = false; btn.innerText = "РАССЧИТАТЬ"; }
}

function downloadPDF() {
    const city = document.getElementById("city").value;
    document.getElementById("p-city").innerText = city;
    let h = "";
    lastItems.forEach(i => {
        h += `<tr>
            <td style="padding:10px; border-bottom:1px solid #eee;">${i.n} (${i.q} ${i.u})</td>
            <td style="padding:10px; border-bottom:1px solid #eee; text-align:right;">${Number(i.p).toLocaleString()} ₸</td>
        </tr>`;
    });
    document.getElementById("p-body").innerHTML = h;
    document.getElementById("p-total").innerText = document.getElementById("total-val").innerText;

    const tpl = document.getElementById("pdf-tpl");
    html2pdf().from(tpl).save(`Smeta_${city}.pdf`);
}

function sendWA() {
    let t = `*СМЕТА ${document.getElementById("city").value}*\n\n`;
    lastItems.forEach(i => t += `• ${i.n}: ${Number(i.p).toLocaleString()} ₸\n🔍 Поиск: ${i.l}\n\n`);
    t += `*ИТОГО: ${document.getElementById("total-val").innerText}*`;
    window.open(`https://wa.me/?text=${encodeURIComponent(t)}`);
}
</script>
</body>
</html>
