<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qazaq Snab AI Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primary: #611fdb; --bg: #f3f4f6; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 40px 20px; margin: 0; }
        .container { width: 100%; max-width: 600px; background: white; padding: 40px; border-radius: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); }
        
        h1 { font-size: 28px; font-weight: 800; text-align: center; margin-bottom: 30px; }
        h1 span { color: var(--primary); }

        label { font-size: 12px; font-weight: 700; color: #9ca3af; margin: 0 0 8px 12px; display: block; }
        select, textarea { 
            width: 100%; padding: 18px; border: 2px solid #f3f4f6; border-radius: 20px; 
            font-size: 16px; margin-bottom: 20px; outline: none; box-sizing: border-box; background: #f9fafb;
        }
        select:focus, textarea:focus { border-color: var(--primary); background: white; }

        button { 
            width: 100%; padding: 20px; border: none; border-radius: 20px; 
            font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-bottom: 12px;
        }
        .btn-main { background: var(--primary); color: white; }
        .btn-wa { background: #25d366; color: white; }
        .btn-pdf { background: #111827; color: white; }
        button:disabled { opacity: 0.5; cursor: wait; }

        /* Таблица на сайте */
        #result { display: none; margin-top: 30px; }
        .web-table { width: 100%; border-collapse: collapse; }
        .web-table td { padding: 16px 10px; border-bottom: 1px solid #f3f4f6; font-size: 15px; }
        .total-val { font-size: 24px; font-weight: 800; color: var(--primary); text-align: right; margin: 20px 0; }

        /* Скрытый блок для PDF (Белый лист) */
        #pdf-template { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1><span>Qazaq</span> Snab AI</h1>
    
    <label>ГОРОД ЗАКУПА</label>
    <select id="city">
        <option value="Караганда">Караганда</option>
        <option value="Астана">Астана</option>
        <option value="Алматы">Алматы</option>
        <option value="Шымкент">Шымкент</option>
    </select>

    <label>ВАШ СПИСОК</label>
    <textarea id="txt" rows="4" placeholder="Напр: 10 мешков цемента..."></textarea>
    
    <button id="btn" class="btn-main" onclick="calc()">РАССЧИТАТЬ СМЕТУ</button>

    <div id="result">
        <table class="web-table" id="main-table"></table>
        <div class="total-val" id="total-sum">0 ₸</div>
        
        <button class="btn-wa" onclick="sendWA()">В WHATSAPP</button>
        <button class="btn-pdf" onclick="downloadPDF()">СКАЧАТЬ PDF</button>
    </div>
</div>

<div id="pdf-template">
    <div style="padding: 40px; color: #000; background: #fff;">
        <h1 style="color: #611fdb; margin: 0;">Смета снабжения</h1>
        <p style="margin: 5px 0 30px 0; color: #666;">Город: <span id="pdf-city"></span> | Дата: 04.05.2026</p>
        
        <table style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="border-bottom: 2px solid #611fdb;">
                    <th style="text-align: left; padding: 10px;">Материал / Магазин</th>
                    <th style="text-align: center; padding: 10px;">Кол-во</th>
                    <th style="text-align: right; padding: 10px;">Сумма</th>
                </tr>
            </thead>
            <tbody id="pdf-table-body"></tbody>
        </table>
        
        <div style="margin-top: 30px; text-align: right; font-size: 20px; font-weight: bold; border-top: 1px solid #eee; padding-top: 20px;">
            ИТОГО К ОПЛАТЕ: <span id="pdf-total"></span>
        </div>
        <p style="margin-top: 50px; font-size: 10px; color: #aaa; text-align: center;">Документ создан автоматически Qazaq Snab AI</p>
    </div>
</div>

<script>
let lastData = [];

async function calc() {
    const txt = document.getElementById("txt").value;
    const city = document.getElementById("city").value;
    const btn = document.getElementById("btn");
    if(!txt) return alert("Введите список");

    btn.disabled = true;
    btn.innerText = "СЧИТАЕМ...";

    try {
        const res = await fetch("/api/calculate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ materials: txt, city: city })
        });
        const data = await res.json();
        const items = JSON.parse(data.choices[0].message.content.match(/\[.*\]/s)[0]);
        lastData = items;

        let sum = 0;
        let html = "";
        items.forEach(i => {
            sum += Number(i.p);
            html += `<tr>
                <td><b>${i.n}</b><br><small style="color:#999">${i.m}</small></td>
                <td style="text-align:right; font-weight:800;">${Number(i.p).toLocaleString()} ₸</td>
            </tr>`;
        });

        document.getElementById("main-table").innerHTML = html;
        document.getElementById("total-sum").innerText = sum.toLocaleString() + " ₸";
        document.getElementById("result").style.display = "block";
    } catch (e) {
        alert("Ошибка ИИ. Попробуйте уточнить список.");
    } finally {
        btn.disabled = false;
        btn.innerText = "РАССЧИТАТЬ СМЕТУ";
    }
}

function downloadPDF() {
    // 1. Заполняем скрытый шаблон данными
    const city = document.getElementById("city").value;
    document.getElementById("pdf-city").innerText = city;
    
    let html = "";
    let sum = 0;
    lastData.forEach(i => {
        sum += Number(i.p);
        html += `<tr>
            <td style="padding:12px; border-bottom:1px solid #eee;"><b>${i.n}</b><br><small style="color:#777">${i.m}</small></td>
            <td style="padding:12px; border-bottom:1px solid #eee; text-align:center;">${i.q} ${i.u}</td>
            <td style="padding:12px; border-bottom:1px solid #eee; text-align:right; font-weight:bold;">${Number(i.p).toLocaleString()} ₸</td>
        </tr>`;
    });
    
    document.getElementById("pdf-table-body").innerHTML = html;
    document.getElementById("pdf-total").innerText = sum.toLocaleString() + " ₸";

    // 2. Генерируем PDF из скрытого шаблона
    const element = document.getElementById('pdf-template');
    element.style.display = "block"; // Временно показываем для снимка
    
    const opt = {
        margin: 0,
        filename: `Smeta_${city}.pdf`,
        image: { type: 'jpeg', quality: 1 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(element).save().then(() => {
        element.style.display = "none"; // Снова прячем
    });
}

function sendWA() {
    let t = `*СМЕТА QAZAQ SNAB (${document.getElementById("city").value})*\n\n`;
    lastData.forEach(i => t += `• ${i.n} (${i.q} ${i.u}) — ${Number(i.p).toLocaleString()} ₸\n`);
    t += `\n*ИТОГО: ${document.getElementById("total-sum").innerText}*`;
    window.open(`https://wa.me/?text=${encodeURIComponent(t)}`);
}
</script>

</body>
</html>
