<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qazaq Snab AI — Снабжение 2.0</title>
    <style>
        :root { --primary: #611fdb; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .app { width: 100%; max-width: 600px; background: white; padding: 25px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        
        h1 { font-size: 22px; text-align: center; color: #1a1a1a; margin-bottom: 20px; }
        h1 span { color: var(--primary); }

        textarea, select { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 16px; font-size: 16px; margin-bottom: 12px; box-sizing: border-box; outline: none; }
        .main-btn { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; }

        #result { display: none; margin-top: 25px; }
        .item-block { border: 1px solid #f0f0f0; border-radius: 20px; padding: 15px; margin-bottom: 15px; background: #fafafa; }
        .item-header { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        
        .offer-row { 
            display: grid; grid-template-columns: 1fr 100px 90px; gap: 10px; 
            padding: 10px; background: white; border-radius: 12px; margin-bottom: 6px; 
            align-items: center; border: 1px solid transparent;
        }
        .offer-row.cheapest { border-color: #2ecc71; background: #fafffb; }
        
        .store-name { font-size: 12px; font-weight: 700; color: #444; }
        .unit-p { font-size: 10px; color: #888; display: block; }
        .total-p { font-weight: 900; text-align: right; color: #1a1a1a; }
        .link-btn { font-size: 10px; background: #1a1a1a; color: white; text-decoration: none; padding: 8px; text-align: center; border-radius: 8px; }

        .summary-card { background: #1a1a1a; color: white; padding: 20px; border-radius: 20px; margin-top: 20px; text-align: right; }
        .summary-card div { font-size: 24px; font-weight: 900; color: #2ecc71; }
    </style>
</head>
<body>

<div class="app">
    <h1><span>Qazaq Snab</span> AI</h1>
    <select id="city">
        <option value="Караганда">Караганда</option>
        <option value="Астана">Астана</option>
        <option value="Алматы">Алматы</option>
    </select>
    <textarea id="txt" rows="3" placeholder="300 кирпичей, 10 мешков ротбанда..."></textarea>
    <button class="main-btn" id="btn" onclick="process()">ПОЛУЧИТЬ ЦЕНЫ</button>

    <div id="result">
        <div id="content"></div>
        <div class="summary-card">
            <small>ОБЩАЯ СУММА (ПО МИН. ЦЕНАМ):</small>
            <div id="grand-total">0 ₸</div>
        </div>
    </div>
</div>

<script>
async function process() {
    const btn = document.getElementById("btn");
    btn.disabled = true; btn.innerText = "ЗАПРОС В МАГАЗИНЫ...";
    
    try {
        const res = await fetch("/api/calculate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ materials: document.getElementById("txt").value, city: document.getElementById("city").value })
        });
        const data = await res.json();
        const results = JSON.parse(data.choices[0].message.content.match(/\[.*\]/s)[0]);

        let finalTotal = 0;
        let html = "";

        results.forEach(item => {
            html += `<div class="item-block">
                <div class="item-header"><span>${item.n}</span> <span>${item.q} ${item.u}</span></div>`;
            
            // Расчет сумм для каждого оффера
            item.offers.forEach(o => o.fullPrice = o.p * item.q);
            // Сортировка (дешевые в начало)
            item.offers.sort((a, b) => a.fullPrice - b.fullPrice);
            
            finalTotal += item.offers[0].fullPrice;

            item.offers.forEach((o, idx) => {
                const isMin = idx === 0;
                html += `
                <div class="offer-row ${isMin ? 'cheapest' : ''}">
                    <div>
                        <span class="store-name">${o.m}</span>
                        <span class="unit-p">${o.p.toLocaleString()} ₸/ед.</span>
                    </div>
                    <div class="total-p">${o.fullPrice.toLocaleString()} ₸</div>
                    <a href="${o.l}" target="_blank" class="link-btn">${o.m === 'Kaspi' ? 'KASPI' : 'В МАГАЗИН'}</a>
                </div>`;
            });
            html += `</div>`;
        });

        document.getElementById("content").innerHTML = html;
        document.getElementById("grand-total").innerText = finalTotal.toLocaleString() + " ₸";
        document.getElementById("result").style.display = "block";
    } catch (e) { alert("Ошибка! Попробуйте изменить запрос."); }
    finally { btn.disabled = false; btn.innerText = "ПОЛУЧИТЬ ЦЕНЫ"; }
}
</script>
</body>
</html>
