<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qazaq Snab AI Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primary: #611fdb; --bg: #f8f9fc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); padding: 20px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: white; padding: 25px; border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        
        h1 { text-align: center; font-weight: 800; font-size: 24px; }
        h1 span { color: var(--primary); }

        select, textarea { 
            width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 18px; 
            font-size: 16px; margin-bottom: 15px; outline: none; box-sizing: border-box; 
        }
        
        .btn { width: 100%; padding: 18px; border: none; border-radius: 18px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
        .btn-calc { background: var(--primary); color: white; }

        /* Карточка товара с вариантами */
        .item-card { background: #fff; border: 1px solid #eee; border-radius: 20px; padding: 15px; margin-bottom: 20px; }
        .item-title { font-weight: 800; font-size: 16px; color: var(--primary); margin-bottom: 10px; display: block; }
        
        .offer-row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 8px 0; border-top: 1px solid #f9f9f9; font-size: 13px;
        }
        .best-offer { background: #f0fff4; border-radius: 10px; padding: 10px; border: 1px solid #c6f6d5; }
        
        .price { font-weight: 800; }
        .link { font-size: 10px; color: var(--primary); text-decoration: none; border: 1px solid; padding: 2px 6px; border-radius: 5px; }

        .total-box { background: #111; color: white; padding: 20px; border-radius: 20px; text-align: right; margin-top: 20px; }
        #pdf-tpl { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1><span>Qazaq Snab</span> Build</h1>
    
    <select id="city">
        <option value="Караганда">Караганда</option>
        <option value="Астана">Астана</option>
        <option value="Алматы">Алматы</option>
        <option value="Шымкент">Шымкент</option>
    </select>

    <textarea id="txt" rows="3" placeholder="Список материалов (напр: ведро, перчатки, цемент)"></textarea>
    
    <button id="btn" class="btn btn-calc" onclick="calc()">НАЙТИ ЛУЧШИЕ ПРЕДЛОЖЕНИЯ</button>

    <div id="result">
        <div id="items-list"></div>
        <div class="total-box">
            <small>ИТОГО (по мин. ценам):</small>
            <div id="total-val" style="font-size: 24px; font-weight: 900;">0 ₸</div>
        </div>
        <button class="btn" style="background:#25d366; color:white;" onclick="sendWA()">В WHATSAPP</button>
        <button class="btn" style="background:#333; color:white;" onclick="downloadPDF()">СКАЧАТЬ PDF</button>
    </div>
</div>

<div id="pdf-tpl">
    <div id="p-content" style="padding:40px; font-family:sans-serif;">
        <h2 style="color:#611fdb">Строительная смета: <span id="p-city"></span></h2>
        <div id="p-body"></div>
        <h2 style="text-align:right">ИТОГО: <span id="p-total"></span></h2>
    </div>
</div>

<script>
let lastData = [];

async function calc() {
    const txt = document.getElementById("txt").value;
    const city = document.getElementById("city").value;
    const btn = document.getElementById("btn");
    if(!txt) return;

    btn.disabled = true;
    btn.innerText = "АНАЛИЗИРУЕМ РЫНОК...";

    try {
        const res = await fetch("/api/calculate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ materials: txt, city: city })
        });
        const data = await res.json();
        lastData = JSON.parse(data.choices[0].message.content.match(/\[.*\]/s)[0]);

        let minTotal = 0;
        let html = "";
        
        lastData.forEach(item => {
            // Сортируем офферы по цене, чтобы найти минимальную
            item.offers.sort((a, b) => a.p - b.p);
            const bestPrice = item.offers[0].p;
            minTotal += bestPrice;

            html += `<div class="item-card">
                <span class="item-title">${item.n} (${item.q} ${item.u})</span>`;
            
            item.offers.forEach((off, index) => {
                const isBest = index === 0;
                html += `
                <div class="offer-row ${isBest ? 'best-offer' : ''}">
                    <span>${isBest ? '⭐ ' : ''}${off.m}</span>
                    <div>
                        <span class="price">${off.p.toLocaleString()} ₸</span>
                        <a href="${off.l}" target="_blank" class="link">КУПИТЬ</a>
                    </div>
                </div>`;
            });
            html += `</div>`;
        });

        document.getElementById("items-list").innerHTML = html;
        document.getElementById("total-val").innerText = minTotal.toLocaleString() + " ₸";
        document.getElementById("result").style.display = "block";
    } catch (e) { alert("Ошибка! Попробуйте еще раз."); }
    finally { btn.disabled = false; btn.innerText = "НАЙТИ ЛУЧШИЕ ПРЕДЛОЖЕНИЯ"; }
}

function downloadPDF() {
    document.getElementById("p-city").innerText = document.getElementById("city").value;
    let h = "";
    lastData.forEach(i => {
        h += `<div style="border-bottom:1px solid #eee; padding:10px 0;">
            <b>${i.n}</b> - Лучшая цена: ${i.offers[0].p.toLocaleString()} ₸ (${i.offers[0].m})
        </div>`;
    });
    document.getElementById("p-body").innerHTML = h;
    document.getElementById("p-total").innerText = document.getElementById("total-val").innerText;
    
    const node = document.getElementById("p-content");
    node.style.display = "block";
    html2pdf().from(node).save().then(() => node.style.display = "none");
}

function sendWA() {
    let t = `*СТРОИТЕЛЬНАЯ СМЕТА (${document.getElementById("city").value})*\n\n`;
    lastData.forEach(i => {
        t += `*${i.n}*\n✅ Лучшая цена: ${i.offers[0].p.toLocaleString()} ₸ (${i.offers[0].m})\n🔗 ${i.offers[0].l}\n\n`;
    });
    t += `*ОБЩИЙ ИТОГ (МИН): ${document.getElementById("total-val").innerText}*`;
    window.open(`https://wa.me/?text=${encodeURIComponent(t)}`);
}
</script>
</body>
</html>
