<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>StroiCalc — Интерактивный план</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #1a1a1a; color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 350px; background: #252525; padding: 25px; border-right: 1px solid #333; box-shadow: 5px 0 15px rgba(0,0,0,0.3); z-index: 10; }
        .canvas-area { flex-grow: 1; position: relative; display: flex; align-items: center; justify-content: center; background-image: radial-gradient(#333 1px, transparent 1px); background-size: 30px 30px; }
        
        .card { background: #333; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        h2 { margin: 0 0 15px 0; font-size: 1.2rem; color: #00d1b2; }
        .param { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; }
        .value { font-weight: bold; color: #fff; }

        #room {
            background: rgba(0, 209, 178, 0.2);
            border: 3px solid #00d1b2;
            position: absolute;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
            min-height: 50px;
        }
        .resize-handle {
            width: 15px; height: 15px; background: white;
            position: absolute; right: -7px; bottom: -7px;
            cursor: nwse-resize; border-radius: 50%;
        }
        .dim-w { position: absolute; top: -25px; width: 100%; text-align: center; color: #00d1b2; font-size: 12px; }
        .dim-h { position: absolute; left: -45px; height: 100%; display: flex; align-items: center; color: #00d1b2; font-size: 12px; }
        
        .total-price { font-size: 1.5rem; color: #ffdd57; text-align: center; margin-top: 10px; }
        .hint { font-size: 0.8rem; color: #888; text-align: center; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>🏗️ Расчет помещения</h2>
    
    <div class="card">
        <div class="param">Ширина: <span class="value" id="ui-w">3.0</span> м.</div>
        <div class="param">Глубина: <span class="value" id="ui-h">4.0</span> м.</div>
        <div class="param">Высота потолков: 
            <select id="ceiling-h" onchange="calculate()">
                <option value="2.5">2.5 м</option>
                <option value="2.7">2.7 м</option>
                <option value="3.0">3.0 м</option>
            </select>
        </div>
    </div>

    <div class="card">
        <h2>📊 Результаты:</h2>
        <div class="param">Площадь пола: <span class="value" id="res-floor">12.0</span> м²</div>
        <div class="param">Площадь стен: <span class="value" id="res-walls">35.0</span> м²</div>
        <div class="param">Периметр (плинтус): <span class="value" id="res-perim">14.0</span> м.</div>
    </div>

    <div class="card">
        <h2>💰 Эстимейт (черновой):</h2>
        <div class="total-price" id="total-cost">145 000 ₸</div>
        <p class="hint">Включает: смесь для пола, штукатурку, работу бригады.</p>
    </div>
    
    <button style="width: 100%; padding: 15px; background: #00d1b2; border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer;">Скачать PDF смету</button>
</div>

<div class="canvas-area">
    <div id="room" style="width: 200px; height: 250px;">
        <div class="dim-w"><span id="dim-w-val">4.0</span> м</div>
        <div class="dim-h"><span id="dim-h-val">5.0</span> м</div>
        <span>Комната</span>
        <div class="resize-handle" id="resizer"></div>
    </div>
</div>

<script>
    const room = document.getElementById('room');
    const resizer = document.getElementById('resizer');
    let isResizing = false;

    // Масштаб: 1 метр = 50 пикселей
    const scale = 50;

    resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        
        const rect = room.getBoundingClientRect();
        const newWidth = e.clientX - rect.left;
        const newHeight = e.clientY - rect.top;

        if (newWidth > 50) room.style.width = newWidth + 'px';
        if (newHeight > 50) room.style.height = newHeight + 'px';
        
        calculate();
    });

    window.addEventListener('mouseup', () => {
        isResizing = false;
    });

    function calculate() {
        const w = parseInt(room.style.width) / scale;
        const h = parseInt(room.style.height) / scale;
        const ceil = parseFloat(document.getElementById('ceiling-h').value);

        // Расчеты
        const floorArea = (w * h).toFixed(1);
        const perimeter = (2 * (w + h)).toFixed(1);
        const wallArea = (perimeter * ceil).toFixed(1);
        
        // Стоимость (примерная: 10к за м2 пола + 2к за м2 стен)
        const cost = (floorArea * 10000 + wallArea * 2500).toLocaleString();

        // Обновление UI
        document.getElementById('ui-w').innerText = w.toFixed(1);
        document.getElementById('ui-h').innerText = h.toFixed(1);
        document.getElementById('dim-w-val').innerText = w.toFixed(1);
        document.getElementById('dim-h-val').innerText = h.toFixed(1);
        
        document.getElementById('res-floor').innerText = floorArea;
        document.getElementById('res-perim').innerText = perimeter;
        document.getElementById('res-walls').innerText = wallArea;
        document.getElementById('total-cost').innerText = cost + ' ₸';
    }

    // Первый запуск
    calculate();
</script>

</body>
</html>
