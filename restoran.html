<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SmartResto — Умный Склад</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 1.2em; }
        
        .product-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #fafafa; }
        .low-stock { color: #d32f2f; font-weight: bold; background: #ffebee; padding: 2px 5px; border-radius: 4px; }
        
        .btn { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; transition: 0.2s; width: 100%; margin-bottom: 10px; font-size: 16px; }
        .btn:hover { background: #0056b3; }
        .btn-order { background: #28a745; }
        
        .order-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .order-table th, .order-table td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
        .empty-msg { color: #888; font-style: italic; }
        
        .recipe-info { font-size: 0.85em; color: #666; margin-bottom: 15px; }
    </style>
</head>
<body>

<h1 style="text-align:center">📊 Ресторанный аналитик: Сток & Заказ</h1>

<div class="grid">
    <div class="card">
        <h2>🛍️ Касса (iiko)</h2>
        <p class="recipe-info">Состав "Картофель Фри": 200г картошки, 20мл масла, 5г соли.</p>
        <button class="btn" onclick="sellDish('fries')">Выбить 1 порцию "Картофель Фри"</button>
        <button class="btn" onclick="sellDish('fries', 5)">Выбить 5 порций (банкет)</button>
        
        <hr>
        <h2>📦 Приход (1С)</h2>
        <button class="btn btn-order" onclick="restock()">Завезти 10кг картошки</button>
    </div>

    <div class="card">
        <h2>📦 Склад (Остатки)</h2>
        <div id="stock-list">
            </div>
    </div>

    <div class="card" style="grid-column: span 2;">
        <h2>📝 Сформированный заказ поставщику (Автоматически)</h2>
        <table class="order-table">
            <thead>
                <tr>
                    <th>Продукт</th>
                    <th>Текущий остаток</th>
                    <th>Мин. порог</th>
                    <th>Рекомендация</th>
                </tr>
            </thead>
            <tbody id="order-body">
                </tbody>
        </table>
        <div id="empty-order" class="empty-msg" style="margin-top:10px;">Всего достаточно. Таблица пуста.</div>
    </div>
</div>

<script>
    // Наша база данных (имитация)
    let stock = {
        potato: { name: "Картофель", qty: 10000, unit: "г", threshold: 2000, refill: 10000 },
        oil: { name: "Масло раст.", qty: 1000, unit: "мл", threshold: 300, refill: 5000 },
        salt: { name: "Соль", qty: 500, unit: "г", threshold: 50, refill: 1000 }
    };

    // Рецептуры (Техкарты)
    const recipes = {
        fries: { potato: 200, oil: 20, salt: 5 }
    };

    function updateUI() {
        const stockList = document.getElementById('stock-list');
        const orderBody = document.getElementById('order-body');
        const emptyMsg = document.getElementById('empty-order');
        
        stockList.innerHTML = '';
        orderBody.innerHTML = '';
        let needsOrder = false;

        for (let key in stock) {
            let item = stock[key];
            let isLow = item.qty <= item.threshold;

            // Обновляем список остатков
            stockList.innerHTML += `
                <div class="product-item">
                    <span>${item.name}</span>
                    <span class="${isLow ? 'low-stock' : ''}">${(item.qty/1000).toFixed(2)} ${item.unit === 'г' ? 'кг' : 'л'}</span>
                </div>
            `;

            // Если мало — добавляем в таблицу заказа
            if (isLow) {
                needsOrder = true;
                orderBody.innerHTML += `
                    <tr>
                        <td>${item.name}</td>
                        <td>${(item.qty/1000).toFixed(2)}</td>
                        <td>${item.threshold/1000}</td>
                        <td style="color:green; font-weight:bold;">Заказать +${item.refill/1000} ${item.unit === 'г' ? 'кг' : 'л'}</td>
                    </tr>
                `;
            }
        }

        emptyMsg.style.display = needsOrder ? 'none' : 'block';
    }

    function sellDish(dishKey, count = 1) {
        const recipe = recipes[dishKey];
        for (let ingredient in recipe) {
            stock[ingredient].qty -= recipe[ingredient] * count;
            if (stock[ingredient].qty < 0) stock[ingredient].qty = 0;
        }
        updateUI();
    }

    function restock() {
        stock.potato.qty += 10000;
        updateUI();
    }

    // Старт
    updateUI();
</script>

</body>
</html>
